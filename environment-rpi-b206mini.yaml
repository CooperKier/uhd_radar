name: uhd-b206mini
channels:
  - conda-forge
  - defaults
dependencies:
  - python>3.8
  - pyserial # USB control of the shared ZED-F9P PPS source (gps_pps.py)
  - libboost-devel # Modern Boost headers/libraries compatible with UHD 4.9+
  - uhd>=4.9,<5 # B206mini support was added in UHD 4.9:
  - scipy
  - matplotlib
  - ruamel.yaml
  - yaml-cpp=0.6.3
  - xarray
  - dask
  - zarr
  - hvplot
  - datashader
  - pip
  - pip:
    - gpiozero
    - RPi.GPIO
    - sparkfun-qwiic
    - pi-ina219
