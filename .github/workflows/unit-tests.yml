name: Unit Tests

on:
  push:
  pull_request:

jobs:
  bistatic-testing:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Up Bistatic Test Environment
        uses: conda-incubator/setup-miniconda@v2
        with:
          activate-environment: bistatic-tests
          python-version: "3.11"
          channels: conda-forge
          channel-priority: strict
          auto-activate-base: false

      - name: Install Bistatic Test Dependencies
        run: conda install --yes cmake make cxx-compiler libboost-devel 'uhd>=4.9,<5' yaml-cpp numpy scipy matplotlib ruamel.yaml

      - name: Build Bistatic Executable and C++ Tests
        run: |
          cmake -S bistatic -B bistatic/build -DBISTATIC_BUILD_RADIO=ON -DBUILD_TESTING=ON
          cmake --build bistatic/build --parallel 2 --target bistatic test_bistatic_protocol

      - name: Run Bistatic C++ Tests
        run: ctest --test-dir bistatic/build --output-on-failure --no-tests=error

      - name: Run Bistatic Runner and Native Configuration Tests
        run: python -m unittest discover -s tests -p test_run_bistatic.py -v

  auto-testing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Up Conda Environment
        uses: conda-incubator/setup-miniconda@v2
        with:
          environment-file: environment-rpi.yaml
          activate-environment: uhd
          auto-activate-base: false
          python-version: 3.11.13

      - name: Cache Conda Environment
        uses: actions/cache@v3
        with:
          path: /home/runner/miniconda3/envs/uhd
          key: conda-env-full-${{ runner.os }}-${{ hashFiles('environment-rpi.yaml') }}-pytest
          restore-keys: |
            conda-env-full-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          conda run -n uhd python -c "import pytest" || conda run -n uhd conda install -y pytest
          sudo apt-get update && sudo apt-get install -y cmake g++ libboost-all-dev libuhd-dev uhd-host

      - name: Build and Install yaml-cpp
        run: |
          git clone https://github.com/jbeder/yaml-cpp.git
          cd yaml-cpp
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local
          make -j$(nproc)
          sudo make install

      - name: Build C++ Tests
        run: |
          cmake -S sdr -B build -DCMAKE_PREFIX_PATH="/usr/lib/x86_64-linux-gnu/cmake/UHD;/usr/local/lib/cmake/yaml-cpp"
          cmake --build build

      - name: Run Python Tests
        run: conda run -n uhd bash -c "PYTHONPATH=. pytest tests/"

      - name: Run C++ Tests
        run: ctest --test-dir build --output-on-failure --extra-verbose -E "gpsLock|check10MhzLock|checkAndSetTime|detectChannels|setRFParams|refLoLockDetect|setupGpio"
